<html>

    html, body {

      width: 100%;
      height: 100%;
    }
    iframe {
      border: none;
      display: none;
    }
    #canvas {
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      position: fixed;
    }
    #vConsole {
      left: 0;
      bottom: 0;
      width: 100vw;
      height: 95vh;
      position: fixed;
    }
    #vBtn {
      width: 100px;
      color: #000;
      position: fixed;
      font-size: 12px;
      line-height: 30px;
      border-radius: 15px;
      background: #0f0;
      font-family: PingFang SC;
      text-align: center;
      top: calc(100vh - 50px);
      left: calc(100vw - 120px);
    }
    #canvas {
      z-index: -1;
      display: block;
      background-color: #000000;
    }
    #canvas.transparentCanvas {
      background-color: transparent;
    }
    #vBtn, #vConsole {
      z-index: 1000;
    }
